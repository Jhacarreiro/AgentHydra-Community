# The copied Portal credential is already Base64; do not encode it a second time.
base_url = "https://api.inworld.ai"
transport = "openai"
check_path = "/voices/v1/voices?pageSize=1"
about = "Inworld's chat model router, speech synthesis and voice catalog. Uses the complete Base64 credential copied from the Portal."
website = "https://inworld.ai"
key_url = "https://platform.inworld.ai"
docs = "https://docs.inworld.ai/api-reference/ttsAPI/texttospeech/synthesize-speech"
auth_header = "Authorization"
auth_prefix = "Basic "
capabilities = ["chat", "text-to-speech", "voices", "model-catalog"]
chat_path = "/v1/chat/completions"
passthrough = ["inworld:"]
options = ["reasoning_effort"]
anthropic_url = "facade"
key_billing = "unknown"
# The catalog has its own schema; list_models returns it through the service adapter.

[operations.synthesize]
method = "POST"
path = "/tts/v1/voice"
capability = "text-to-speech"
response = "json"

[operations.list_voices]
method = "GET"
path = "/voices/v1/voices"
capability = "voices"
response = "json"

[operations.list_models]
method = "GET"
path = "/llm/v1alpha/models"
capability = "model-catalog"
response = "json"
docs = "https://docs.inworld.ai/api-reference/modelsAPI/modelservice/list-models"

# Ranked routes (2026-10-13). Inworld's router serves other labs' models on one key: every price, context, output cap,
# image input and tool-calling flag below is Inworld's own catalog (GET /llm/v1alpha/models, read 2026-10-13), and each
# route sends the effort its benchmark point names, only where the catalog lists that level for the model (so no Claude
# max route: Inworld's Claude levels stop at xhigh). A request names a model as <host>/<model>, and the standard
# reasoning_effort field reaches the model: probed 2026-10-13, reasoning tokens rose with it and tool calls came back
# through every host here. Of the nine keys here, six answer: three call tools, three only chat (HTTP 400 "Tool calling
# is currently restricted on your plan", which the client skips for tool calls: client._TOOLS_REFUSED_400), two are
# refused (403) and one is out of credit. The Claude and GPT routes come after CliMayte (after_climayte): CliMayte runs
# Claude on the owner's subscriptions, and the owner keeps API sales of those models for last (2026-10-13).

[models."rank:claude-opus-5-5-xhigh:inworld"]
api_id = "anthropic/claude-opus-5-5"
benchmark_slug = "claude-opus-5-5-xhigh"
ctx = 1000000
max_out = 128000
vision = true
tools = true
price_ref = "inworld/rank:claude-opus-5-5-xhigh:inworld"
default_reasoning_effort = "xhigh"
default_thinking = true
cc_effort = false
after_climayte = true

