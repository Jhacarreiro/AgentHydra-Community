name: Codex hub tray

# The Codex hub's tray app (codex-hub-tray/, Go): go vet and go test, its end-to-end test on Linux (test-linux.sh)
# against a fake hub and against the real one (scripts/codex-hub-test-daemon.ts), and its reproducible build
# (build.sh), which must give the same SHA-256 twice from one commit, for the builds and for the licence files beside
# them.
# ci.yml has no Go in it, so a change to the tray is checked here, and only a change that touches it or the hub's side
# of what it talks to.
#
# The builds here carry example addresses and an example public key (the key whose seed is the bytes 0 to 31, which
# the tray's and the signing script's tests use), never an operator's: they are compared and thrown away.
on:
  push:
    branches: [main]
    paths:
      - 'codex-hub-tray/**'
      - '.github/workflows/codex-hub-tray.yml'
      - 'scripts/third-party-licenses.*'
      - 'LICENSE'
      - 'NOTICE'
      - 'server/src/core/codex-hub*.ts'
      - 'server/src/routes/codex-hub.ts'
      - 'scripts/codex-hub-*.ts'
      - 'server/tests/codex-hub-daemon.ts'
  pull_request:
    paths:
      - 'codex-hub-tray/**'
      - '.github/workflows/codex-hub-tray.yml'
      - 'scripts/third-party-licenses.*'
      - 'LICENSE'
      - 'NOTICE'
      - 'server/src/core/codex-hub*.ts'
      - 'server/src/routes/codex-hub.ts'
      - 'scripts/codex-hub-*.ts'
      - 'server/tests/codex-hub-daemon.ts'
  workflow_dispatch:

concurrency:
  group: codex-hub-tray-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUB_URL: https://hub.example.test
  PAIR_URL: https://inbox.example.test/codex-hub/pair
  INBOX_URL: https://inbox.example.test
  UPDATE_KEY: A6EHv/POEL4dcN0Y50vAmWfk1jCbpQ1fHdyGZBJVMbg=

jobs:
  linux:
    name: vet, test, end to end and reproducible build (Linux; Windows and Linux builds)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: codex-hub-tray
    steps:
      # The whole history: test-linux.sh builds the tray of the commit before PC tokens, to see it move.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      # The Go go.mod's toolchain line names: build.sh builds with exactly that one.
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: codex-hub-tray/go.mod
          cache-dependency-path: codex-hub-tray/go.sum

      # build.sh writes each build's licence file with scripts/third-party-licenses.ts, which runs on Bun.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: go vet (Linux, Windows and the test helpers)
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          go vet ./testdata/fakehub ./testdata/signbuild ./testdata/sniwatcher

      - name: go test
        run: go test ./...

      # test-linux.sh runs the real hub too (scripts/codex-hub-test-daemon.ts), which needs the root's packages.
      - name: Install dependencies (root)
        working-directory: .
        run: bun install --frozen-lockfile

      # A private session bus (dbus-run-session), a stand-in tray host, a fake hub and the real one; nothing outside
      # its scratch folder.
      - name: End to end (test-linux.sh)
        run: |
          command -v dbus-run-session >/dev/null || { sudo apt-get update && sudo apt-get install -y dbus; }
          ./test-linux.sh

      # Twice, the second time with an empty build cache and from another folder: the same bytes both times.
      - name: Reproducible build
        run: |
          OUT="$RUNNER_TEMP/first" ./build.sh
          cp -r . "$RUNNER_TEMP/another folder"
          rm -rf "$RUNNER_TEMP/another folder/dist"
          GOCACHE="$RUNNER_TEMP/empty-cache" OUT="$RUNNER_TEMP/second" REPO_ROOT="$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/another folder/build.sh"
          diff "$RUNNER_TEMP/first/SHA256SUMS" "$RUNNER_TEMP/second/SHA256SUMS"
          {
            echo '### Tray builds (example addresses and key)'
            echo '```'
            go version
            cat "$RUNNER_TEMP/first/SHA256SUMS"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  macos:
    name: vet, test and reproducible build (macOS builds)
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: codex-hub-tray
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: codex-hub-tray/go.mod
          cache-dependency-path: codex-hub-tray/go.sum

      # build.sh writes each build's licence file with scripts/third-party-licenses.ts, which runs on Bun.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # build-macos.sh through build.sh: the app, its zip and the hub's two darwin builds. Only the hub's builds are
      # compared; the zip holds file times, so its hash is in SHA256SUMS-macos-zip, which must check out.
      - name: Reproducible build
        run: |
          TARGETS=macos OUT="$RUNNER_TEMP/first" ./build.sh
          cp -R . "$RUNNER_TEMP/another folder"
          rm -rf "$RUNNER_TEMP/another folder/dist"
          GOCACHE="$RUNNER_TEMP/empty-cache" TARGETS=macos OUT="$RUNNER_TEMP/second" REPO_ROOT="$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/another folder/build.sh"
          diff "$RUNNER_TEMP/first/SHA256SUMS" "$RUNNER_TEMP/second/SHA256SUMS"
          (cd "$RUNNER_TEMP/first" && shasum -a 256 -c SHA256SUMS-macos-zip)
          {
            echo '### Tray builds (example addresses and key)'
            echo '```'
            go version
            cat "$RUNNER_TEMP/first/SHA256SUMS"
            echo '# the zip, not the same bytes twice:'
            cat "$RUNNER_TEMP/first/SHA256SUMS-macos-zip"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
