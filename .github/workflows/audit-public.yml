name: Public audit

# audit:public (scripts/audit-public.mjs) on every push and pull request: the tree as it stands and
# every commit since 3a65ba8e, the MIT base this repository is built from. The pre-push hook runs the
# same audit on what a push carries; this is the copy a hook cannot skip (--no-verify, a push from a
# machine without the hooks, a pull request from a fork).
#
# No paths-ignore, unlike ci.yml: a docs-only or Markdown-only change can publish an email address or
# a token as easily as code can, and history is checked commit by commit, so a value added and
# removed again is still caught. Both are read in one run, because only a run that has read both can
# tell that an allowlist entry clears nothing anywhere; such a stale entry fails it. Nothing is
# installed: the audit needs only git and bun.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: audit-public-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: audit:public (tree and history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The whole history, for --history. A pull request is checked out at its own head commit, not
      # at the merge commit GitHub makes for it, so the commits read are exactly the ones pushed.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      # With no mode, the audit reads the tree at HEAD and every commit from the config's base (the MIT
      # base) to HEAD, and fails on an allowlist entry that cleared nothing in either.
      - name: Tree, history and allowlist
        run: bun scripts/audit-public.mjs
