name: Capture Community screenshots (temporary)
on:
  push:
    branches: [docs/refresh-readme-shots]
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: cd desk2 && bun install --frozen-lockfile
      - run: bun run build
      - run: which google-chrome || which chromium
      - run: bun run screenshots -- --keep
      - uses: actions/upload-artifact@v4
        with:
          name: community-screenshots
          path: tmp/screenshots/*.png
          if-no-files-found: error
