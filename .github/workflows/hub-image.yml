# Publishes the Docker hub image (deploy/docker/Dockerfile) to GitHub's container registry for each
# stable release, so `docker compose up -d` in deploy/docker needs no local build:
#   ghcr.io/<owner>/agenthydra-community-hub:<version> and :latest
# It runs after the Release workflow finishes on a tag, pushed or dispatched (a release made by that
# workflow's token starts no `release` event), and on demand for a version already published. The
# image is built from the release's own Linux archives, checked against its SHA256SUMS; only the Dockerfile comes from the
# default branch. A pre-release or a draft gets no image, and :latest goes only to releases/latest.
name: Hub image

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Published stable release to build the hub image from (YYYY.M.PATCH)'
        required: true

permissions:
  contents: read

concurrency:
  group: hub-image
  cancel-in-progress: false

jobs:
  image:
    timeout-minutes: 60
    name: build and push the hub image
    runs-on: ubuntu-latest
    # A Release run dispatched on a tag publishes too; one on a branch is a validation run, skipped below.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
    steps:
      - id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          RUN_REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          tag="v${INPUT_VERSION:-${RUN_REF#v}}"
          version=${tag#v}
          skip() { echo "$1: no hub image"; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0; }
          if ! [[ "$version" =~ ^20[0-9]{2}\.[0-9]{1,2}\.[0-9]{1,3}$ ]]; then
            [ -z "$INPUT_VERSION" ] && skip "Release ran on '$RUN_REF', not a release tag"
            echo "::error::'$tag' is not a YYYY.M.PATCH release tag"
            exit 1
          fi
          if ! info=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"'); then
            [ -z "$INPUT_VERSION" ] && skip "$tag has no release"
            echo "::error::$tag has no release"
            exit 1
          fi
          read -r draft pre <<< "$info"
          if [ "$draft" != false ] || [ "$pre" != false ]; then
            skip "$tag is a draft or a pre-release"
          fi
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/agenthydra-community-hub"
          tags="$image:$version"
          [ "$latest" = "$tag" ] && tags="$tags,$image:latest"
          echo "Hub image for $tag: $tags"
          {
            echo "publish=true"
            echo "version=$version"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"

      - if: steps.release.outputs.publish == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: deploy/docker

      - if: steps.release.outputs.publish == 'true'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - if: steps.release.outputs.publish == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: steps.release.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - if: steps.release.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/docker
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.release.outputs.version }}
          tags: ${{ steps.release.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.licenses=MIT
          push: true
