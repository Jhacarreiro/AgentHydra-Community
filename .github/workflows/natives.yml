# Native programs: build the Windows programs AgentHydra runs, and the Codex hub tray, from this
# repository's source on every change to it.
#
# The tray host (misc/tray-host-native), CliMayte's runner (misc/climayte-runner-native) and the window
# host (desk2/launcher/host) are Rust, built by scripts/build-natives.ts with the Rust release each crate's
# rust-toolchain.toml pins, --locked, every machine path remapped and the linker stamping content instead
# of the time. They are not committed: a release builds its own (release.yml), the Windows CI leg builds
# the two its tests start (ci.yml), and a PC builds them with the same script. This workflow builds all
# three twice, from two checkouts in different folders, and fails when the two builds differ, so the
# sha256 it prints (in the run's summary and in the natives-windows-x64 artifact) depends on the commit
# and the tools, not on where it was built: another PC gets the same bytes from the same commit with the
# same Rust release and the same MSVC build tools (the runner image's; the linker writes its version
# into the program).
#
# The Codex hub tray (codex-hub-tray/, Go) is built for Windows, Linux and macOS with -trimpath,
# -buildvcs=false and an empty build id. These builds carry no hub address or update key (main.go's -X
# flags): they show that the source builds everywhere and give a hash to compare against; a hub
# operator builds the ones their PCs run, with their own addresses (codex-hub-tray/main.go).
name: Native programs

on:
  push:
    branches: [main]
    paths:
      - 'desk2/launcher/host/**'
      - 'misc/tray-host-native/**'
      - 'misc/climayte-runner-native/**'
      # Compiled into the window host (desk2/launcher/host/build.rs).
      - 'misc/AgentHydra.ico'
      - 'scripts/build-natives.ts'
      - 'tests/repo-root.ts'
      - 'codex-hub-tray/**'
      - '.github/workflows/natives.yml'
  pull_request:
    paths:
      - 'desk2/launcher/host/**'
      - 'misc/tray-host-native/**'
      - 'misc/climayte-runner-native/**'
      - 'misc/AgentHydra.ico'
      - 'scripts/build-natives.ts'
      - 'tests/repo-root.ts'
      - 'codex-hub-tray/**'
      - '.github/workflows/natives.yml'
  workflow_dispatch:

concurrency:
  group: natives-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  windows:
    timeout-minutes: 60
    name: tray host · CliMayte runner · window host (windows-x64)
    runs-on: windows-latest
    steps:
      # Two checkouts of the same commit at different depths: every path rustc could write into a
      # program differs between them, so equal hashes show that none was written.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: first

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: elsewhere/second copy

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      # Only the downloaded crates (the window host's tao, wry and windows); every build compiles them.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('first/desk2/launcher/host/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      # --test runs each crate's own tests first. rustup installs the pinned Rust release.
      - name: Build (first checkout)
        working-directory: first
        run: bun scripts/build-natives.ts --test --out ../natives-a

      - name: Build again (second checkout, another folder)
        working-directory: elsewhere/second copy
        run: bun scripts/build-natives.ts --out ../../natives-b

      - name: The two builds are the same bytes
        shell: bash
        run: |
          set -euo pipefail
          cat natives-a/natives.sha256
          if ! diff natives-a/natives.sha256 natives-b/natives.sha256; then
            echo "::error::Two builds of the same commit from two folders differ: the build is not reproducible. Compare the exes in natives-a and natives-b."
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: natives-windows-x64
          path: natives-a/
          if-no-files-found: error
          retention-days: 14

  codex-hub-tray:
    timeout-minutes: 30
    name: codex-hub-tray (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: codex-hub-tray
        shell: bash
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.24.7'
          cache-dependency-path: codex-hub-tray/go.sum

      # The unit tests need no desktop. test-linux.sh and test-macos.sh (end to end, against a fake
      # hub) stay the hub's own.
      - name: Vet and test (Linux)
        if: runner.os == 'Linux'
        run: |
          go vet ./...
          go test ./...

      # macOS needs cgo and the Xcode command line tools (the menu bar code is Objective-C), the
      # others build without a C compiler. The names are the ones the hub serves builds under.
      - name: Build
        run: |
          set -euo pipefail
          flags='-s -w -buildid='
          build() { echo "$1/$2 -> dist/$3"; GOOS=$1 GOARCH=$2 go build -trimpath -buildvcs=false -ldflags "$flags $4" -o "dist/$3" .; }
          case "$RUNNER_OS" in
            Linux)
              CGO_ENABLED=0 build linux amd64 codex-hub-tray-linux-x64 ''
              CGO_ENABLED=0 build linux arm64 codex-hub-tray-linux-arm64 ''
              ;;
            Windows)
              CGO_ENABLED=0 build windows amd64 codex-hub-tray.exe '-H=windowsgui'
              ;;
            macOS)
              export MACOSX_DEPLOYMENT_TARGET=11.0
              CGO_ENABLED=1 build darwin arm64 codex-hub-tray-darwin-arm64 ''
              CGO_ENABLED=1 build darwin amd64 codex-hub-tray-darwin-x64 ''
              ;;
          esac
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum -- *; else shasum -a 256 -- *; fi | tee SHA256SUMS
          { echo "### codex-hub-tray ($RUNNER_OS)"; echo; echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codex-hub-tray-${{ runner.os }}
          path: codex-hub-tray/dist/
          if-no-files-found: error
          retention-days: 14
